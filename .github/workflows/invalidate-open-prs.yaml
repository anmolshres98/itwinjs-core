# FORK VERIFICATION COPY — adapted to run in a fork with the default GITHUB_TOKEN.
# Differences from upstream: uses secrets.GITHUB_TOKEN + explicit statuses:write permission.
name: Invalidate Open PRs when imodeljs-native is updated

on:
  workflow_dispatch:
  push:
    branches:
    - 'master'
    paths:
    - '**/core/backend/package.json'

jobs:
  invalidate:
    name: Invalidate imodeljs-native status check
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Set Git Config
        run: |
          git config --local user.email imodeljs-admin@users.noreply.github.com
          git config --local user.name imodeljs-admin

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Run invalidate-status-checks.mjs
        run: |
          node ./.github/workflows/automation-scripts/invalidate-status-checks.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
